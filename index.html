<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>主計局電話查詢</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#1d2129;--muted:#6b7280;--line:#e3e6ea;
  --accent:#0b5cad;--accent-bg:#e7f0fa;--hit:#fff1a8;--chip:#eef0f3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418;--card:#1b1f25;--text:#e6e8eb;--muted:#9aa3ad;--line:#2b3138;
    --accent:#6cb0f5;--accent-bg:#1d2b3b;--hit:#5a4b00;--chip:#262c33;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;
  padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1 small{font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap}
.search{position:relative}
.search[hidden]{display:none}
.chip{text-decoration:none}
.search input{width:100%;font-size:18px;padding:12px 44px 12px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);color:var(--text);outline:none}
.search input:focus{border-color:var(--accent)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;
  color:var(--muted);font-size:22px;width:36px;height:36px;border-radius:50%;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;
  padding:4px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.status{font-size:13px;color:var(--muted);margin-top:6px}
main{padding:8px 16px 40px;max-width:720px;margin:0 auto}
h2{scroll-margin-top:190px;font-size:14px;color:var(--muted);margin:18px 4px 6px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:600;font-size:17px}
.unit{font-size:12px;color:var(--muted);text-align:right}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.num{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;
  background:var(--chip);border-radius:8px;padding:4px 8px;font-size:15px;color:var(--text);text-decoration:none}
a.num{background:var(--accent-bg);color:var(--accent)}
.num .k{font-size:11px;color:var(--muted)}
a.num .k{color:inherit;opacity:.8}
.note{font-size:13px;color:var(--muted);margin-top:4px}
mark{background:var(--hit);color:inherit;border-radius:3px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
footer{font-size:12px;color:var(--muted);text-align:center;padding:0 16px 24px}
.lock{max-width:320px;margin:72px auto;padding:0 16px;text-align:center}
.lock p{color:var(--muted);font-size:14px;margin:0 0 12px}
.lock input{width:100%;font-size:22px;letter-spacing:.3em;text-align:center;padding:12px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);color:var(--text);outline:none}
.lock input:focus{border-color:var(--accent)}
.lock button{margin-top:12px;width:100%;font-size:16px;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
.lock button:disabled{opacity:.6}
.lock .err{color:#c62828;font-size:14px;min-height:20px;margin-top:8px}
.chip{font:inherit;font-size:14px;line-height:inherit}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.tools button,.dbtn button,.edit .del{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer}
.tools button.pri,.dbtn button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.tools #btnSet{margin-left:auto}
.msg{white-space:pre-line;font-size:13px;margin-top:6px;color:var(--accent)}
.msg.bad{color:#c62828}
.card.edit{padding:10px 12px}
.edit .erow{display:flex;gap:8px;margin-bottom:6px}
.edit label,#tokbox label{flex:1;min-width:0;display:block;font-size:12px;color:var(--muted)}
.edit label span{display:block;margin-bottom:2px}
.edit input,#tokbox input{width:100%;font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.edit .del{color:#c62828;margin-top:2px}
dialog{max-width:440px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 8px;font-size:17px}
.help{font-size:13px;color:var(--muted);margin:0 0 12px}
#tokbox label{margin-bottom:10px;position:relative}
#tokbox em{font-style:normal;color:var(--accent)}
#tokbox .link{position:absolute;right:0;top:-2px;border:0;background:none;color:#c62828;font-size:12px;cursor:pointer}
.dbtn{display:flex;gap:8px;justify-content:flex-end}
[hidden]{display:none!important}
</style>
</head>
<body>
<form class="lock" id="lock" autocomplete="off">
  <p>此頁需要密碼</p>
  <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="密碼" aria-label="密碼" autofocus>
  <button id="unlock" type="submit">解鎖</button>
  <div class="err" id="err" role="alert"></div>
</form>
<header id="hdr" hidden>
  <h1>國防部主計局電話查詢 <small id="date"></small></h1>
  <div class="search" id="search" hidden>
    <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="電話、分機或姓名" aria-label="搜尋">
    <button id="clear" type="button" aria-label="清除" hidden>×</button>
  </div>
  <div class="tools">
    <button id="btnEdit" type="button">✎ 編輯</button>
    <span id="ebar" hidden><button id="btnSave" type="button" class="pri">儲存</button><button id="btnCancel" type="button">取消</button><button id="btnAdd" type="button">＋新增一筆</button></span>
    <button id="btnSet" type="button" aria-label="設定權杖" title="GitHub 權杖設定">⚙</button>
  </div>
  <div class="msg" id="msg" role="status" hidden></div>
  <nav class="chips" id="chips" aria-label="單位"></nav>
  <div class="status" id="status"></div>
</header>
<datalist id="ulist"></datalist>
<main id="list" hidden></main>
<dialog id="settings">
  <h3>GitHub 權杖設定</h3>
  <p class="help">存檔時用來把修改寫回網站。權杖只存在這支裝置的瀏覽器，每個 repo 要用<b>該 repo 擁有者帳號</b>建立：GitHub → Settings → Developer settings → Fine-grained tokens，「Repository access」只選該 repo，「Permissions → Contents」設為 Read and write，並設定有效期限。</p>
  <div id="tokbox"></div>
  <div class="dbtn"><button id="tokSave" type="button" class="pri">儲存</button><button id="tokClose" type="button">關閉</button></div>
</dialog>
<footer>分機為軍線；手機與「☎」市話可直接點擊撥打。</footer>

const ITER = 600000;

  {repo:"ucom636836/phonebook", branch:"main", path:"index.html"},

const PAY_RE = /const PAYLOAD = "([A-Za-z0-9+\/=]+)";/;
const ITER_RE = /const ITER = (\d+);/;
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const toB64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };

//#crypto-begin
async function deriveKey(pw, salt, usage){
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:ITER, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, [usage]);
}
async function decryptPayload(p, pw){
  const raw = b64(p);
  const key = await deriveKey(pw, raw.slice(0, 16), "decrypt");
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:raw.slice(16, 28)}, key, raw.slice(28)); // 密碼錯誤時會丟出例外
  const o = JSON.parse(dec.decode(buf));
  return Array.isArray(o) ? {date:"", D:o} : o;
}
async function encryptPayload(obj, pw){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt, "encrypt");
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(JSON.stringify(obj))));
  const out = new Uint8Array(28 + ct.length); out.set(salt); out.set(iv, 16); out.set(ct, 28);
  return toB64(out);
}
//#crypto-end

// ---------- 狀態 ----------
let PW = "", curPayload = PAYLOAD;
let D = [], meta = {date:""}, baselineD = "";
let rows = [], units = [], unitFilter = "";
let editing = false, draft = null, composing = false, saving = false;

// ---------- 資料處理（欄位：[單位, 姓名/職稱, 分機, 手機, 市話(☎), 傳真, 備註]） ----------
const split = s => (s || "").split("、").filter(Boolean);
const digits = s => s.replace(/\D/g, "");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// 把「638244-269」「8509-9210~12」「252265-8」展開成 [起, 迄] 數字區間
function range(tok){
  let m = tok.match(/^(\d+)-(\d+)$/);            // 分機區間：638244-269
  if (m && m[1].length >= 6 && m[2].length < m[1].length){
    const a = m[1], b = a.slice(0, a.length - m[2].length) + m[2];
    return [a, b];
  }
  m = tok.match(/^(\d{4})-(\d{4})~(\d+)$/);        // 市話區間：8509-9210~12
  if (m){
    const a = m[1] + m[2], b = a.slice(0, a.length - m[3].length) + m[3];
    return [a, b];
  }
  return null;
}

function buildRows(list){
  return list.map(([unit, name, ext, mob, tel, fax, note]) => {
    const nums = [];
    split(ext).forEach(v => nums.push({k:"分機", v}));
    split(mob).forEach(v => nums.push({k:"手機", v, href:"tel:" + v}));
    split(tel).forEach(v => nums.push({k:"☎", v, href: range(v) ? null : "tel:02" + digits(v)}));
    split(fax).forEach(v => nums.push({k:"傳真", v}));
    if (note){ const m = note.match(/急診\s*(\d+)/); if (m) nums.push({k:"急診", v:m[1]}); }
    nums.forEach(n => { n.d = digits(n.v); n.r = range(n.v); });
    return {unit, name, note, nums, text:(unit + name + (note || "")).toLowerCase()};
  });
}

function setData(list){
  D = list;
  rows = buildRows(D);
  units = [...new Set(D.map(r => r[0]))];
  if (unitFilter && !units.includes(unitFilter)) unitFilter = "";
  $("ulist").innerHTML = units.map(u => `<option value="${esc(u)}">`).join("");
  $("chips").innerHTML = ["全部", ...units].map((u, i) =>
    `<button type="button" class="chip" data-u="${i ? esc(u) : ""}" aria-pressed="${(i ? u : "") === unitFilter}">${esc(u)}</button>`).join("");
  $("date").textContent = meta.date ? "製表 " + meta.date : "";
}

// ---------- 搜尋顯示 ----------
function hl(text, q){
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  return i < 0 ? esc(text) : esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i, i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
}

// 數字比對時，以原字串中的數字位置標示（忽略「-」）
function hlNum(v, qd){
  if (!qd) return esc(v);
  const pos = []; for (let i = 0; i < v.length; i++) if (/\d/.test(v[i])) pos.push(i);
  const d = pos.map(i => v[i]).join("");
  const at = d.indexOf(qd);
  if (at < 0) return esc(v);
  const s = pos[at], e = pos[at + qd.length - 1] + 1;
  return esc(v.slice(0,s)) + "<mark>" + esc(v.slice(s,e)) + "</mark>" + esc(v.slice(e));
}

function numHit(n, qd){
  if (!qd) return false;
  if (n.d.includes(qd)) return true;
  if (n.r && qd.length === n.r[0].length) return qd >= n.r[0] && qd <= n.r[1];
  // 市話也可只輸入後 8 碼外加區碼 02
  if (n.k === "☎" && qd.startsWith("02") && ("02" + n.d).includes(qd)) return true;
  return false;
}

function renderView(){
  const raw = $("q").value.trim();
  const q = raw.toLowerCase();
  const qd = digits(raw);
  const isNum = qd.length > 0 && /^[\d\s\-()~+]+$/.test(raw);

  const res = rows.filter(r => {
    if (unitFilter && r.unit !== unitFilter) return false;
    if (!raw) return true;
    if (isNum) return r.nums.some(n => numHit(n, qd));
    return r.text.includes(q);
  });

  const html = [];
  let last = null;
  res.forEach(r => {
    if (!raw && r.unit !== last){ html.push(`<h2 id="u-${esc(r.unit)}">${esc(r.unit)}</h2>`); last = r.unit; }
    const nums = r.nums.map(n => {
      const hit = isNum && numHit(n, qd);
      const v = hit ? hlNum(n.v, qd) : esc(n.v);
      const inRange = hit && n.r && !n.d.includes(qd) ? ` <span class="k">含 ${esc(qd)}</span>` : "";
      const body = `<span class="k">${n.k}</span>${v}${inRange}`;
      return n.href ? `<a class="num" href="${n.href}">${body}</a>` : `<span class="num">${body}</span>`;
    }).join("");
    html.push(`<div class="card"><div class="top"><span class="name">${isNum ? esc(r.name) : hl(r.name, q)}</span>`
      + `<span class="unit">${isNum ? esc(r.unit) : hl(r.unit, q)}</span></div>`
      + `<div class="nums">${nums}</div>`
      + (r.note ? `<div class="note">${isNum ? esc(r.note) : hl(r.note, q)}</div>` : "")
      + `</div>`);
  });
  $("list").innerHTML = html.join("") || `<div class="empty">查無「${esc(raw)}」</div>`;
  $("status").textContent = raw || unitFilter ? `找到 ${res.length} 筆` : `共 ${rows.length} 筆`;
}

// ---------- 編輯模式 ----------
const LABELS = ["單位", "姓名／職稱", "分機", "手機", "市話（☎）", "傳真", "備註"];
const HINTS = ["", "", "多個以「、」分隔", "", "例：8509-9203", "", ""];

function matchDraft(r, raw){
  if (!raw) return true;
  if (r.join(" ").toLowerCase().includes(raw.toLowerCase())) return true;
  const qd = digits(raw);
  return qd.length > 0 && /^[\d\s\-()~+]+$/.test(raw) && r.some(f => digits(f).includes(qd));
}

function renderEdit(){
  const raw = $("q").value.trim();
  let n = 0;
  const html = draft.map((r, i) => {
    if (unitFilter && r[0] !== unitFilter) return "";
    if (!matchDraft(r, raw)) return "";
    n++;
    const f = (k, extra) => `<label><span>${LABELS[k]}</span><input data-f="${k}" value="${esc(r[k])}" placeholder="${HINTS[k]}" autocomplete="off" ${extra || ""}></label>`;
    return `<div class="card edit" data-i="${i}">`
      + `<div class="erow">${f(0, 'list="ulist"')}${f(1)}</div>`
      + `<div class="erow">${f(2)}${f(3, 'inputmode="tel"')}</div>`
      + `<div class="erow">${f(4)}${f(5)}</div>`
      + `<div class="erow">${f(6)}</div>`
      + `<button type="button" class="del" data-del>刪除此筆</button></div>`;
  }).join("");
  $("list").innerHTML = html || `<div class="empty">沒有符合的資料</div>`;
  $("status").textContent = `編輯中：顯示 ${n} 筆（共 ${draft.length} 筆）`;
}

function refresh(){
  const raw = $("q").value;
  $("clear").hidden = !raw;
  editing ? renderEdit() : renderView();
}

const trimTail = r => { const a = r.map(x => String(x).trim()); while (a.length > 2 && a[a.length - 1] === "") a.pop(); return a; };
const cleanList = list => list.map(trimTail).filter(r => r.some(Boolean));
const regroup = list => { const order = []; list.forEach(r => { if (!order.includes(r[0])) order.push(r[0]); }); return order.flatMap(u => list.filter(r => r[0] === u)); };
const dirty = () => JSON.stringify(regroup(cleanList(draft))) !== JSON.stringify(regroup(cleanList(D)));
const say = (t, bad) => { const m = $("msg"); m.textContent = t || ""; m.className = "msg" + (bad ? " bad" : ""); m.hidden = !t; };

function enterEdit(){
  draft = D.map(r => { const a = r.slice(0, 7); while (a.length < 7) a.push(""); return a; });
  editing = true; say("");
  $("btnEdit").hidden = true; $("ebar").hidden = false; $("btnSet").hidden = false;
  document.body.classList.add("editing");
  refresh();
}
function leaveEdit(){
  editing = false; draft = null;
  $("btnEdit").hidden = false; $("ebar").hidden = true;
  document.body.classList.remove("editing");
  refresh();
}

// ---------- GitHub 權杖 ----------
const tokKey = repo => "pbtok:" + repo;
const getTok = repo => { try { return localStorage.getItem(tokKey(repo)) || ""; } catch(e){ return ""; } };
const setTok = (repo, v) => { try { v ? localStorage.setItem(tokKey(repo), v) : localStorage.removeItem(tokKey(repo)); } catch(e){} };

function openSettings(){
  $("tokbox").innerHTML = TARGETS.map((t, i) =>
    `<label><span>${esc(t.repo)}　<em>${getTok(t.repo) ? "已設定" : "未設定"}</em></span>`
    + `<input type="password" data-i="${i}" autocomplete="off" placeholder="${getTok(t.repo) ? "留空＝不變" : "貼上 GitHub 權杖"}">`
    + `<button type="button" class="link" data-clear="${i}">清除</button></label>`).join("");
  $("settings").showModal();
}

async function gh(t, method, body){
  const res = await fetch(`https://api.github.com/repos/${t.repo}/contents/${t.path}` + (method === "GET" ? `?ref=${encodeURIComponent(t.branch)}` : ""), {
    method, cache:"no-store",
    headers:{Authorization:"Bearer " + getTok(t.repo), Accept:"application/vnd.github+json", ...(body ? {"Content-Type":"application/json"} : {})},
    body: body ? JSON.stringify(body) : undefined,
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(res.status + " " + (j.message || ""));
  return j;
}

async function pushOne(t, newPayload, newJson){
  const cur = await gh(t, "GET");
  const text = dec.decode(b64(cur.content));
  const m = text.match(PAY_RE), im = text.match(ITER_RE);
  if (!m) throw new Error("找不到資料區塊");
  if (!im || +im[1] !== ITER) throw new Error("加密參數與遠端不一致");
  let remote;
  try { remote = await decryptPayload(m[1], PW); } catch(e){ throw new Error("遠端密碼與目前不同"); }
  const rj = JSON.stringify(remote.D);
  if (rj === newJson) return "已是最新";
  if (rj !== baselineD) throw new Error("遠端資料已被別處更新，請重新整理後再編輯");
  const out = text.replace(PAY_RE, () => `const PAYLOAD = "${newPayload}";`);
  await gh(t, "PUT", {message:"更新電話資料（網頁編輯）", content:toB64(enc.encode(out)), sha:cur.sha, branch:t.branch});
  return "已更新";
}

function rocToday(){
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return `${d.getFullYear() - 1911}.${p(d.getMonth() + 1)}.${p(d.getDate())}`;
}

async function save(){
  if (saving) return;
  const list = cleanList(draft);
  const bad = list.findIndex(r => !r[0] || !r[1]);
  if (bad >= 0){ say(`有資料缺少「單位」或「姓名」：${list[bad].filter(Boolean).join(" / ") || "（空白）"}`, true); return; }
  const newD = regroup(list), newJson = JSON.stringify(newD);
  if (newJson === JSON.stringify(regroup(cleanList(D)))){ say("沒有變更"); leaveEdit(); return; }
  const targets = TARGETS.filter(t => getTok(t.repo));
  if (!targets.length){ say("尚未設定 GitHub 權杖，請先按 ⚙ 設定。", true); openSettings(); return; }

  saving = true; $("btnSave").disabled = true;
  try {
    say("加密中…");
    const date = rocToday();
    const newPayload = await encryptPayload({date, D:newD}, PW);
    const lines = [], fails = [];
    for (const t of targets){
      say(`寫入 ${t.repo} …`);
      try { lines.push(`${t.repo}：${await pushOne(t, newPayload, newJson)}`); }
      catch(e){ fails.push(`${t.repo}：${e.message}`); }
    }
    const skipped = TARGETS.filter(t => !getTok(t.repo)).map(t => t.repo + "：未設定權杖，已略過");
    if (fails.length){ say("部分失敗，可修正後再按儲存重試。\n" + [...fails, ...lines, ...skipped].join("\n"), true); return; }
    curPayload = newPayload; meta.date = date; baselineD = newJson;
    setData(newD); leaveEdit();
    say("已儲存。網站約 1～2 分鐘後對所有人更新。\n" + [...lines, ...skipped].join("\n"));
  } catch(e){
    say("儲存失敗：" + e.message, true);
  } finally { saving = false; $("btnSave").disabled = false; }
}

// ---------- 事件 ----------
function bind(){
  $("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    unitFilter = b.dataset.u;
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    refresh();
    window.scrollTo({top:0});
  });
  $("q").addEventListener("input", () => { if (!composing) refresh(); });
  $("q").addEventListener("compositionstart", () => { composing = true; });
  $("q").addEventListener("compositionend", () => { composing = false; refresh(); });
  $("clear").addEventListener("click", () => { $("q").value = ""; refresh(); $("q").focus(); });

  $("btnEdit").addEventListener("click", enterEdit);
  $("btnCancel").addEventListener("click", () => { if (!dirty() || confirm("放棄尚未儲存的修改？")) { say(""); leaveEdit(); } });
  $("btnSave").addEventListener("click", save);
  $("btnAdd").addEventListener("click", () => {
    $("q").value = "";
    const u = unitFilter; let at = 0;
    if (u) for (let i = draft.length - 1; i >= 0; i--) if (draft[i][0] === u){ at = i + 1; break; }
    draft.splice(at, 0, [u, "", "", "", "", "", ""]);
    refresh();
    const c = document.querySelector(`.card[data-i="${at}"] input[data-f="${u ? 1 : 0}"]`);
    if (c){ c.scrollIntoView({block:"center"}); c.focus(); }
  });
  $("list").addEventListener("input", e => {
    if (!editing) return;
    const inp = e.target.closest("input[data-f]"); if (!inp) return;
    draft[+inp.closest(".card").dataset.i][+inp.dataset.f] = inp.value;
  });
  $("list").addEventListener("click", e => {
    const b = e.target.closest("[data-del]"); if (!b || !editing) return;
    const i = +b.closest(".card").dataset.i, r = draft[i];
    if (confirm(`刪除「${r[1].trim() || "（空白）"}」？`)){ draft.splice(i, 1); refresh(); }
  });

  $("btnSet").addEventListener("click", openSettings);
  $("tokbox").addEventListener("click", e => {
    const b = e.target.closest("[data-clear]"); if (!b) return;
    setTok(TARGETS[+b.dataset.clear].repo, ""); openSettings();
  });
  $("tokSave").addEventListener("click", () => {
    $("tokbox").querySelectorAll("input[data-i]").forEach(inp => { const v = inp.value.trim(); if (v) setTok(TARGETS[+inp.dataset.i].repo, v); });
    $("settings").close();
  });
  $("tokClose").addEventListener("click", () => $("settings").close());
  window.addEventListener("beforeunload", e => { if (editing && dirty()){ e.preventDefault(); e.returnValue = ""; } });
}

function start(o){
  meta = {date:o.date || ""};
  baselineD = JSON.stringify(o.D);
  $("lock").hidden = true; $("hdr").hidden = false; $("list").hidden = false;
  bind();
  setData(o.D);
  refresh();
}

async function tryUnlock(pw, silent){
  const btn = $("unlock"), err = $("err");
  btn.disabled = true; err.textContent = "";
  try {
    const o = await decryptPayload(PAYLOAD, pw);
    PW = pw;
    try { sessionStorage.setItem("pb", pw); } catch(e){}
    start(o);
  } catch(e){
    try { sessionStorage.removeItem("pb"); } catch(_){}
    if (!silent){ err.textContent = "密碼錯誤"; $("pw").select(); }
  } finally { btn.disabled = false; }
}

$("lock").addEventListener("submit", e => { e.preventDefault(); tryUnlock($("pw").value.trim()); });
let saved = null; try { saved = sessionStorage.getItem("pb"); } catch(e){}
if (saved) tryUnlock(saved, true);
</script>
