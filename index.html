<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>電話查詢</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#1d2129;--muted:#6b7280;--line:#e3e6ea;
  --accent:#0b5cad;--accent-bg:#e7f0fa;--hit:#fff1a8;--chip:#eef0f3;--err:#c0262d;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418;--card:#1b1f25;--text:#e6e8eb;--muted:#9aa3ad;--line:#2b3138;
    --accent:#6cb0f5;--accent-bg:#1d2b3b;--hit:#5a4b00;--chip:#262c33;--err:#ff7b80;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;
  padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1 small{font-size:12px;font-weight:400;color:var(--muted);white-space:nowrap}
.search{position:relative}
.search input{width:100%;font-size:18px;padding:12px 44px 12px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);color:var(--text);outline:none}
.search input:focus{border-color:var(--accent)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;
  color:var(--muted);font-size:22px;width:36px;height:36px;border-radius:50%;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;
  padding:4px 12px;font-size:14px;cursor:pointer;text-decoration:none}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.status{font-size:13px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px}
.status button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0}
main{padding:8px 16px 40px;max-width:720px;margin:0 auto}
h2{scroll-margin-top:190px;font-size:14px;color:var(--muted);margin:18px 4px 6px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.name{font-weight:600;font-size:17px}
.unit{font-size:12px;color:var(--muted);text-align:right}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.num{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;
  background:var(--chip);border-radius:8px;padding:4px 8px;font-size:15px;color:var(--text);text-decoration:none}
a.num{background:var(--accent-bg);color:var(--accent)}
.num .k{font-size:11px;color:var(--muted)}
a.num .k{color:inherit;opacity:.8}
.note{font-size:13px;color:var(--muted);margin-top:4px}
mark{background:var(--hit);color:inherit;border-radius:3px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
footer{font-size:12px;color:var(--muted);text-align:center;padding:0 16px 24px}
/* 解鎖畫面 */
.lock{max-width:360px;margin:12vh auto 0;padding:0 16px}
.lock h1{display:block;font-size:20px;text-align:center;margin-bottom:16px}
.lock form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.lock label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.lock input[type=password]{width:100%;font-size:18px;padding:12px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--bg);color:var(--text);outline:none}
.lock input[type=password]:focus{border-color:var(--accent)}
.lock .row{display:flex;align-items:center;gap:6px;margin:12px 0 16px;font-size:14px;color:var(--muted)}
.lock button{width:100%;font-size:17px;padding:12px;border:0;border-radius:12px;background:var(--accent);
  color:#fff;cursor:pointer}
.lock button:disabled{opacity:.6;cursor:default}
.lock .msg{min-height:1.4em;margin-top:10px;font-size:14px;color:var(--err);text-align:center}
</style>
</head>
<body>
<section class="lock" id="lock">
  <h1>電話查詢</h1>
  <form id="unlock" autocomplete="off">
    <label for="pw">請輸入密碼</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <div class="row"><input id="remember" type="checkbox"><label for="remember" style="margin:0">在這台裝置記住密碼</label></div>
    <button id="go" type="submit">開啟</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
</section>

<div id="app" hidden>
<header>
  <h1><span id="title"></span> <small id="date"></small></h1>
  <div class="search">
    <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="電話、分機或姓名" aria-label="搜尋">
    <button id="clear" type="button" aria-label="清除" hidden>×</button>
  </div>
  <nav class="chips" id="chips" aria-label="單位"></nav>
  <div class="status"><span id="status"></span><button id="logout" type="button">鎖定</button></div>
</header>
<main id="list"></main>
<footer id="foot"></footer>
</div>

const KEY = "phone-dir-pw";
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}

function store(fn){ try { return fn(localStorage); } catch { return null; } }

async function tryUnlock(pw, remember){
  const data = await decrypt(pw);           // 密碼錯誤時會丟出例外
  if (remember) store(s => s.setItem(KEY, pw));
  start(data);
}

if (!window.crypto || !crypto.subtle){
  $("msg").textContent = "此瀏覽器不支援解密，請改用 Chrome、Safari 或 Edge 以 https 開啟。";
  $("go").disabled = true;
} else {
  const saved = store(s => s.getItem(KEY));
  if (saved) tryUnlock(saved, false).catch(() => store(s => s.removeItem(KEY)));
}

$("unlock").addEventListener("submit", async e => {
  e.preventDefault();
  $("go").disabled = true; $("msg").textContent = ""; $("go").textContent = "解密中…";
  try { await tryUnlock($("pw").value, $("remember").checked); }
  catch { $("msg").textContent = "密碼錯誤"; $("pw").select(); }
  $("go").disabled = false; $("go").textContent = "開啟";
});

$("logout").addEventListener("click", () => { store(s => s.removeItem(KEY)); location.reload(); });

// ---- 以下為解密後的查詢程式 ----
function start({title, date, footer, D}){
  $("lock").hidden = true; $("app").hidden = false;
  $("title").textContent = title; $("date").textContent = date; $("foot").textContent = footer;
  document.title = title;

  const split = s => (s || "").split("、").filter(Boolean);
  const digits = s => s.replace(/\D/g, "");

  // 把「638244-269」「8509-9210~12」「252265-8」展開成 [起, 迄] 數字區間
  function range(tok){
    let m = tok.match(/^(\d+)-(\d+)$/);
    if (m && m[1].length >= 6 && m[2].length < m[1].length){
      const a = m[1], b = a.slice(0, a.length - m[2].length) + m[2];
      return [a, b];
    }
    m = tok.match(/^(\d{4})-(\d{4})~(\d+)$/);
    if (m){
      const a = m[1] + m[2], b = a.slice(0, a.length - m[3].length) + m[3];
      return [a, b];
    }
    return null;
  }

  const rows = D.map(([unit, name, ext, mob, tel, fax, note]) => {
    const nums = [];
    split(ext).forEach(v => nums.push({k:"分機", v}));
    split(mob).forEach(v => nums.push({k:"手機", v, href:"tel:" + v}));
    split(tel).forEach(v => nums.push({k:"☎", v, href: range(v) ? null : "tel:02" + digits(v)}));
    split(fax).forEach(v => nums.push({k:"傳真", v}));
    if (note){ const m = note.match(/急診\s*(\d+)/); if (m) nums.push({k:"急診", v:m[1]}); }
    nums.forEach(n => { n.d = digits(n.v); n.r = range(n.v); });
    return {unit, name, note, nums, text:(unit + name + (note || "")).toLowerCase()};
  });

  const units = [...new Set(D.map(r => r[0]))];
  let unitFilter = "";
  const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

  function hl(text, q){
    if (!q) return esc(text);
    const i = text.toLowerCase().indexOf(q);
    return i < 0 ? esc(text) : esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i, i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
  }

  function hlNum(v, qd){
    if (!qd) return esc(v);
    const pos = []; for (let i = 0; i < v.length; i++) if (/\d/.test(v[i])) pos.push(i);
    const d = pos.map(i => v[i]).join("");
    const at = d.indexOf(qd);
    if (at < 0) return esc(v);
    const s = pos[at], e = pos[at + qd.length - 1] + 1;
    return esc(v.slice(0,s)) + "<mark>" + esc(v.slice(s,e)) + "</mark>" + esc(v.slice(e));
  }

  function numHit(n, qd){
    if (!qd) return false;
    if (n.d.includes(qd)) return true;
    if (n.r && qd.length === n.r[0].length) return qd >= n.r[0] && qd <= n.r[1];
    if (n.k === "☎" && qd.startsWith("02") && ("02" + n.d).includes(qd)) return true;
    return false;
  }

  function render(){
    const raw = $("q").value.trim();
    const q = raw.toLowerCase();
    const qd = digits(raw);
    const isNum = qd.length > 0 && /^[\d\s\-()~+]+$/.test(raw);
    $("clear").hidden = !raw;

    const res = rows.filter(r => {
      if (unitFilter && r.unit !== unitFilter) return false;
      if (!raw) return true;
      if (isNum) return r.nums.some(n => numHit(n, qd));
      return r.text.includes(q);
    });

    const html = [];
    let last = null;
    res.forEach(r => {
      if (!raw && r.unit !== last){ html.push(`<h2 id="u-${esc(r.unit)}">${esc(r.unit)}</h2>`); last = r.unit; }
      const nums = r.nums.map(n => {
        const hit = isNum && numHit(n, qd);
        const v = hit ? hlNum(n.v, qd) : esc(n.v);
        const inRange = hit && n.r && !n.d.includes(qd) ? ` <span class="k">含 ${esc(qd)}</span>` : "";
        const body = `<span class="k">${n.k}</span>${v}${inRange}`;
        return n.href ? `<a class="num" href="${n.href}">${body}</a>` : `<span class="num">${body}</span>`;
      }).join("");
      html.push(`<div class="card"><div class="top"><span class="name">${isNum ? esc(r.name) : hl(r.name, q)}</span>`
        + `<span class="unit">${isNum ? esc(r.unit) : hl(r.unit, q)}</span></div>`
        + `<div class="nums">${nums}</div>`
        + (r.note ? `<div class="note">${isNum ? esc(r.note) : hl(r.note, q)}</div>` : "")
        + `</div>`);
    });
    $("list").innerHTML = html.join("") || `<div class="empty">查無「${esc(raw)}」</div>`;
    $("status").textContent = raw || unitFilter ? `找到 ${res.length} 筆` : `共 ${rows.length} 筆`;
  }

  $("chips").innerHTML = ["全部", ...units].map((u, i) =>
    `<a class="chip" href="#" data-u="${i ? esc(u) : ""}" aria-pressed="${i === 0}">${esc(u)}</a>`).join("");
  $("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    e.preventDefault();
    unitFilter = b.dataset.u;
    document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    render();
    window.scrollTo(0, 0);
  });
  $("q").addEventListener("input", render);
  $("clear").addEventListener("click", () => { $("q").value = ""; render(); $("q").focus(); });
  render();
}
</script>
</body>
</html>
